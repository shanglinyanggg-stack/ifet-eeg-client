[package]
name = "ifet-eeg-client"
version = "0.1.0"
description = "iFET EEG desktop BLE client"
authors = ["iFET"]
edition = "2021"
rust-version = "1.77"
default-run = "ifet-eeg-client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
btleplug = "0.11"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
