name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/eeg-client-sleep-v0.2.5"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create algorithm build environment
        shell: pwsh
        run: |
          python -m venv output/build-tools/sleep-service-venv
          output/build-tools/sleep-service-venv/Scripts/python.exe -m pip install --disable-pip-version-check --upgrade pip
          output/build-tools/sleep-service-venv/Scripts/python.exe -m pip install -r src-tauri/resources/SleepStagingAlgorithm_PC_v1.2.0/requirements-runtime.txt pyinstaller

      - name: Run algorithm unit tests
        shell: pwsh
        run: output/build-tools/sleep-service-venv/Scripts/python.exe scripts/test_sleep_demo_v1021.py

      - name: Build algorithm sidecar exe
        shell: pwsh
        run: scripts/build-windows-algorithm.ps1

      - name: Smoke test algorithm exe
        shell: pwsh
        run: scripts/smoke-test-windows-algorithm.ps1

      - name: Frontend type check and tests
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Build Tauri installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ifet-eeg-client-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
